[project]
name = "compatibility-curve"
version = "0.1.4"
description = "Static client-side app for reconstructing Wald compatibility curves from reported 95% confidence intervals"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Brian Locke" },
]
maintainers = [
  { name = "Brian Locke" },
]
keywords = [
  "compatibility-curve",
  "confidence-curve",
  "confidence-interval",
  "wald-inference",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.2.5,<2.3",
  "wald-inference @ https://github.com/reblocke/wald-inference-core/releases/download/v0.4.2/wald_inference-0.4.2-py3-none-any.whl#sha256=225331d7b9d7b70e2508eecb92851a92a8c4e245baf412a1eb0f464d85da1349",
]

[project.urls]
Repository = "https://github.com/reblocke/compatibility-curve"
Issues = "https://github.com/reblocke/compatibility-curve/issues"
Documentation = "https://github.com/reblocke/compatibility-curve/blob/main/docs/SCIENTIFIC_SCOPE.md"
Hosted = "https://reblocke.github.io/compatibility-curve/"

[dependency-groups]
dev = [
  "hypothesis>=6.151,<7",
  "playwright>=1.55,<2",
  "pytest>=9.0.3,<10",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.15.1,<1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compatibility_curve = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "e2e: browser end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["compatibility_curve"]
